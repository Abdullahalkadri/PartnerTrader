<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Trader - Order Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1420;
    --card:#161c2c;
    --border:#232a3d;
    --gold:#b8934f;
    --gold-text:#0f1420;
    --teal:#6fd1c9;
    --text:#e8e8ec;
    --muted:#8b93a7;
    --green:#3f9142;
    --red:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px;
  }
  .panel{max-width:480px;margin:0 auto;}
  .header{
    font-size:13px;
    letter-spacing:1px;
    color:var(--teal);
    text-transform:uppercase;
    border-bottom:1px solid var(--border);
    padding-bottom:12px;
    margin-bottom:16px;
  }
  .field{margin-bottom:14px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  label{
    display:block;
    font-size:12px;
    color:var(--teal);
    margin-bottom:6px;
    letter-spacing:.3px;
  }
  input[type=text], input[type=number]{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
    font-size:15px;
  }
  input:focus{outline:none;border-color:var(--gold);}
  .toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .toggle-row.three-col{grid-template-columns:1fr 1fr 1fr;}
  .toggle-btn{
    padding:10px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .toggle-btn.active{
    background:var(--gold);
    color:var(--gold-text);
    border-color:var(--gold);
  }
  .checkbox-row{margin:12px 0 4px 0;}
  .checkbox-row label{
    display:flex;
    align-items:center;
    color:var(--text);
    font-size:14px;
    cursor:pointer;
  }
  .checkbox-row input{margin-right:8px;width:16px;height:16px;}
  .btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    margin-top:10px;
  }
  .btn-green{background:var(--green);}
  .btn-red{background:var(--red);}
  .quick-actions{margin-top:22px;border-top:1px solid var(--border);padding-top:14px;}
  .quick-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
  .quick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .btn-quick{
    padding:10px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
  }
  .notice{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:14px;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="header">Order Configuration &middot; <span id="symbolTitle">GOLD</span></div>

  <div class="field">
    <label>Instrument</label>
    <div class="toggle-row three-col">
      <button type="button" class="toggle-btn active" data-group="instrument" data-value="XAUUSD">Gold</button>
      <button type="button" class="toggle-btn" data-group="instrument" data-value="US100">US100</button>
      <button type="button" class="toggle-btn" data-group="instrument" data-value="custom">Custom</button>
    </div>
  </div>
  <div class="field" id="customSymbolField" style="display:none;">
    <label>Custom Instrument (send /findsymbol in the bot first to get the exact name)</label>
    <input type="text" id="customSymbol" value="">
  </div>

  <div class="field">
    <label>Order Type</label>
    <div class="toggle-row">
      <button type="button" class="toggle-btn active" data-group="mode" data-value="market">Market Orders</button>
      <button type="button" class="toggle-btn" data-group="mode" data-value="future">Future Orders</button>
    </div>
  </div>

  <div class="field" id="futurePriceField" style="display:none;">
    <label>Future Reference Price</label>
    <input type="number" step="0.01" id="futureprice" value="0">
  </div>

  <div class="row-2">
    <div class="field"><label>Buy Stops</label><input type="number" id="buystops" value="5"></div>
    <div class="field"><label>Sell Stops</label><input type="number" id="sellstops" value="5"></div>
  </div>

  <div class="row-2">
    <div class="field"><label>First Order Distance ($)</label><input type="number" step="0.01" id="firstdistance" value="5"></div>
    <div class="field"><label>Order Spacing ($)</label><input type="number" step="0.01" id="spacing" value="2"></div>
  </div>

  <div class="field">
    <label>Position Size Mode</label>
    <div class="toggle-row">
      <button type="button" class="toggle-btn active" data-group="sizing" data-value="fixed">Fixed Lot</button>
      <button type="button" class="toggle-btn" data-group="sizing" data-value="risk">Risk %</button>
    </div>
  </div>

  <div class="field" id="lotField">
    <label>Lot Size</label>
    <input type="number" step="0.01" id="lot" value="0.01">
  </div>
  <div class="field" id="riskField" style="display:none;">
    <label>Risk % per order</label>
    <input type="number" step="0.1" id="risk" value="1">
  </div>

  <div class="checkbox-row">
    <label><input type="checkbox" id="noSl" checked> No Stop Loss</label>
  </div>
  <div class="field" id="slField" style="display:none;">
    <label>Stop Loss ($)</label>
    <input type="number" step="0.01" id="slamount" value="5">
  </div>

  <div class="checkbox-row">
    <label><input type="checkbox" id="noTp" checked> No Take Profit</label>
  </div>
  <div class="field" id="tpField" style="display:none;">
    <label>Take Profit ($)</label>
    <input type="number" step="0.01" id="tpamount" value="5">
  </div>

  <div class="field">
    <label>Kill Switch: opposite-side trigger count</label>
    <input type="number" step="1" id="killswitchcount" value="3">
  </div>

  <button class="btn btn-green" id="btnPlace">Place Orders</button>
  <button class="btn btn-red" id="btnCloseAll">Close All Trades</button>

  <div class="quick-actions">
    <div class="quick-title">Quick Actions</div>
    <div class="quick-row">
      <button class="btn-quick" id="btnCancelPending">Cancel Pending</button>
      <button class="btn-quick" id="btnRecenter">Re-center Grid</button>
    </div>
    <div class="quick-row" style="grid-template-columns:1fr 1fr 1fr;">
      <button class="btn-quick" id="btnSecureBE">Breakeven</button>
      <button class="btn-quick" id="btnSecure10">Lock 10%</button>
      <button class="btn-quick" id="btnSecure30">Lock 30%</button>
    </div>
    <div class="quick-title" style="margin-top:14px;">Future Market</div>
    <div class="quick-row">
      <button class="btn-quick" id="btnShowPending">Pending Now</button>
      <button class="btn-quick" id="btnCancelFuture">Cancel Future</button>
    </div>
  </div>

  <div class="notice" id="notice"></div>
</div>

<script>
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  else { document.getElementById('notice').textContent = 'Preview mode - open this from the bot to actually send commands.'; }

  // Prefill from the query string the bot builds (?symbol=...&buystops=...&etc)
  var params = new URLSearchParams(window.location.search);
  function setVal(id, key, fallback){
    var v = params.get(key);
    var el = document.getElementById(id);
    if(v !== null && v !== '') el.value = v;
    else if(fallback !== undefined) el.value = fallback;
  }
  setVal('futureprice','futureprice','0');
  setVal('buystops','buystops','5');
  setVal('sellstops','sellstops','5');
  setVal('firstdistance','firstdistance','5');
  setVal('spacing','spacing','2');
  setVal('lot','lot','0.01');
  setVal('risk','risk','1');
  setVal('slamount','slamount','5');
  setVal('tpamount','tpamount','5');
  setVal('killswitchcount','maxoppositefills','3');

  // Instrument: Gold / US100 / Custom - whichever the bot last remembered gets pre-selected
  var incomingSymbol = params.get('symbol') || 'XAUUSD';
  var instrumentChoice = (incomingSymbol === 'XAUUSD' || incomingSymbol === 'US100') ? incomingSymbol : 'custom';
  if(instrumentChoice === 'custom') document.getElementById('customSymbol').value = incomingSymbol;

  function getSymbolValue(){
    return (groupValues.instrument === 'custom') ? str('customSymbol') : groupValues.instrument;
  }
  function updateSymbolTitle(){
    document.getElementById('symbolTitle').textContent = getSymbolValue().toUpperCase();
  }
  document.getElementById('customSymbol').addEventListener('input', updateSymbolTitle);

  // Toggle button groups (Instrument / Order Type / Position Size Mode)
  var groupValues = { instrument: instrumentChoice, mode: params.get('mode') || 'market', sizing: params.get('sizing') || 'fixed' };
  document.querySelectorAll('.toggle-btn').forEach(function(btn){
    var group = btn.dataset.group, value = btn.dataset.value;
    if(groupValues[group] === value) btn.classList.add('active'); else btn.classList.remove('active');
    btn.addEventListener('click', function(){
      document.querySelectorAll('.toggle-btn[data-group="'+group+'"]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      groupValues[group] = value;
      applyVisibility();
    });
  });

  function applyVisibility(){
    document.getElementById('futurePriceField').style.display = (groupValues.mode === 'future') ? 'block' : 'none';
    document.getElementById('lotField').style.display = (groupValues.sizing === 'fixed') ? 'block' : 'none';
    document.getElementById('riskField').style.display = (groupValues.sizing === 'risk') ? 'block' : 'none';
    document.getElementById('slField').style.display = document.getElementById('noSl').checked ? 'none' : 'block';
    document.getElementById('tpField').style.display = document.getElementById('noTp').checked ? 'none' : 'block';
    document.getElementById('customSymbolField').style.display = (groupValues.instrument === 'custom') ? 'block' : 'none';
    updateSymbolTitle();
  }
  // Pre-set checkboxes from query string (sl=true means stop loss IS enabled -> "No Stop Loss" unchecked)
  document.getElementById('noSl').checked = (params.get('sl') !== 'true');
  document.getElementById('noTp').checked = (params.get('tp') !== 'true');
  document.getElementById('noSl').addEventListener('change', applyVisibility);
  document.getElementById('noTp').addEventListener('change', applyVisibility);
  applyVisibility();

  function num(id){ return parseFloat(document.getElementById(id).value) || 0; }
  function str(id){ return document.getElementById(id).value.trim(); }

  var alreadySubmitting = false;
  function sendAction(payload){
    if(alreadySubmitting) return; // blocks a double-tap from sending the same action twice
    alreadySubmitting = true;
    if(!tg){ alert('Open this panel from the Telegram bot to send commands.'); alreadySubmitting = false; return; }
    tg.sendData(JSON.stringify(payload));
    tg.close();
  }

  document.getElementById('btnPlace').addEventListener('click', function(){
    sendAction({
      action: 'place',
      symbol: getSymbolValue(),
      mode: groupValues.mode,
      futureprice: num('futureprice'),
      buystops: num('buystops'),
      sellstops: num('sellstops'),
      firstdistance: num('firstdistance'),
      spacing: num('spacing'),
      sizing: groupValues.sizing,
      lot: num('lot'),
      risk: num('risk'),
      sl: !document.getElementById('noSl').checked,
      slamount: num('slamount'),
      tp: !document.getElementById('noTp').checked,
      tpamount: num('tpamount'),
      maxoppositefills: num('killswitchcount')
    });
  });

  document.getElementById('btnCloseAll').addEventListener('click', function(){
    if(confirm('Cancel all pending orders and close all open positions for ' + getSymbolValue() + '?')) sendAction({action:'closeall', symbol: getSymbolValue(), maxoppositefills: num('killswitchcount')});
  });
  document.getElementById('btnCancelPending').addEventListener('click', function(){
    sendAction({action:'cancelpending', symbol: getSymbolValue(), maxoppositefills: num('killswitchcount')});
  });
  document.getElementById('btnRecenter').addEventListener('click', function(){
    sendAction({action:'recenter', symbol: getSymbolValue(), maxoppositefills: num('killswitchcount')});
  });
  document.getElementById('btnSecureBE').addEventListener('click', function(){
    sendAction({action:'securebreakeven', symbol: getSymbolValue(), maxoppositefills: num('killswitchcount')});
  });
  document.getElementById('btnSecure10').addEventListener('click', function(){
    sendAction({action:'secure10', symbol: getSymbolValue(), maxoppositefills: num('killswitchcount')});
  });
  document.getElementById('btnSecure30').addEventListener('click', function(){
    sendAction({action:'secure30', symbol: getSymbolValue(), maxoppositefills: num('killswitchcount')});
  });
  document.getElementById('btnShowPending').addEventListener('click', function(){
    sendAction({action:'showpending', symbol: getSymbolValue()});
  });
  document.getElementById('btnCancelFuture').addEventListener('click', function(){
    sendAction({action:'cancelfuture', symbol: getSymbolValue()});
  });
</script>
</body>
</html>
