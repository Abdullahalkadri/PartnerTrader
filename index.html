<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Trader - Order Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1420;
    --card:#161c2c;
    --border:#232a3d;
    --gold:#b8934f;
    --gold-text:#0f1420;
    --teal:#6fd1c9;
    --text:#e8e8ec;
    --muted:#8b93a7;
    --green:#3f9142;
    --red:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px;
  }
  .panel{max-width:480px;margin:0 auto;}
  .lang-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
  .lang-btn{
    padding:6px 14px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .lang-btn.active{background:var(--gold);color:var(--gold-text);border-color:var(--gold);}
  .header{
    font-size:13px;
    letter-spacing:1px;
    color:var(--teal);
    text-transform:uppercase;
    border-bottom:1px solid var(--border);
    padding-bottom:12px;
    margin-bottom:16px;
  }
  .field{margin-bottom:14px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  label{
    display:block;
    font-size:12px;
    color:var(--teal);
    margin-bottom:6px;
    letter-spacing:.3px;
  }
  input[type=text], input[type=number]{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
    font-size:15px;
  }
  input:focus{outline:none;border-color:var(--gold);}
  .toggle-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .toggle-row.three-col{grid-template-columns:1fr 1fr 1fr;}
  .toggle-btn{
    padding:10px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .toggle-btn.active{
    background:var(--gold);
    color:var(--gold-text);
    border-color:var(--gold);
  }
  .checkbox-row{margin:12px 0 4px 0;}
  .checkbox-row label{
    display:flex;
    align-items:center;
    color:var(--text);
    font-size:14px;
    cursor:pointer;
  }
  html[dir="rtl"] .checkbox-row input{margin-left:8px;margin-right:0;}
  .checkbox-row input{margin-right:8px;width:16px;height:16px;}
  .btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    margin-top:10px;
  }
  .btn-green{background:var(--green);}
  .btn-red{background:var(--red);}
  .btn-neutral{background:var(--gold);color:var(--gold-text);}
  .quick-actions{margin-top:22px;border-top:1px solid var(--border);padding-top:14px;}
  .quick-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
  .quick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .btn-quick{
    padding:10px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:13px;
    cursor:pointer;
  }
  .notice{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:14px;
  }
  .trigger-section{margin-top:14px;}
  .trigger-row{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
  }
  .trigger-row label{margin-bottom:8px;}
  .trigger-controls{display:flex;gap:8px;align-items:center;}
  .trigger-controls input{flex:1 1 auto;min-width:0;}
  .trigger-controls button{flex:0 0 auto;width:auto;margin-top:0;padding:10px 14px;font-size:13px;}
  .suggestions-list{
    margin-top:6px;
    max-height:180px;
    overflow-y:auto;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--card);
    display:none;
  }
  .suggestions-list.show{display:block;}
  .suggestion-item{
    padding:10px 12px;
    font-size:14px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .suggestion-item:last-child{border-bottom:none;}
  .suggestion-item:hover, .suggestion-item.highlighted{background:var(--gold);color:var(--gold-text);}
</style>
</head>
<body>
<div class="panel">
  <div class="lang-row">
    <button type="button" class="lang-btn" id="langEn">EN</button>
    <button type="button" class="lang-btn" id="langAr">عربي</button>
  </div>

  <div class="header"><span data-i18n="header">Order Configuration</span> &middot; <span id="symbolTitle">GOLD</span></div>

  <div class="field">
    <label data-i18n="instrument">Instrument</label>
    <div class="toggle-row three-col">
      <button type="button" class="toggle-btn active" data-group="instrument" data-value="XAUUSD" data-i18n="gold">Gold</button>
      <button type="button" class="toggle-btn" data-group="instrument" data-value="US100">US100</button>
      <button type="button" class="toggle-btn" data-group="instrument" data-value="custom" data-i18n="custom">Custom</button>
    </div>
  </div>
  <div class="field" id="customSymbolField" style="display:none;">
    <label data-i18n="customInstrumentLabel">Custom Instrument</label>
    <input type="text" id="customSymbol" value="" dir="ltr" autocomplete="off">
    <div id="symbolSuggestions" class="suggestions-list"></div>
  </div>

  <div class="field">
    <label data-i18n="orderType">Order Type</label>
    <div class="toggle-row">
      <button type="button" class="toggle-btn active" data-group="mode" data-value="market" data-i18n="marketOrders">Market Orders</button>
      <button type="button" class="toggle-btn" data-group="mode" data-value="future" data-i18n="futureOrders">Future Orders</button>
    </div>
  </div>

  <div class="field" id="futurePriceField" style="display:none;">
    <label data-i18n="futureRefPrice">Future Reference Price</label>
    <input type="number" step="0.01" id="futureprice" value="0" dir="ltr">
  </div>

  <div class="row-2">
    <div class="field"><label data-i18n="buyStops">Buy Stops</label><input type="number" id="buystops" value="5" dir="ltr"></div>
    <div class="field"><label data-i18n="sellStops">Sell Stops</label><input type="number" id="sellstops" value="5" dir="ltr"></div>
  </div>

  <div class="row-2">
    <div class="field"><label data-i18n="firstDistance">First Order Distance ($)</label><input type="number" step="0.01" id="firstdistance" value="5" dir="ltr"></div>
    <div class="field"><label data-i18n="spacing">Order Spacing ($)</label><input type="number" step="0.01" id="spacing" value="2" dir="ltr"></div>
  </div>

  <div class="field">
    <label data-i18n="sizingMode">Position Size Mode</label>
    <div class="toggle-row">
      <button type="button" class="toggle-btn active" data-group="sizing" data-value="fixed" data-i18n="fixedLot">Fixed Lot</button>
      <button type="button" class="toggle-btn" data-group="sizing" data-value="risk" data-i18n="riskPct">Risk %</button>
    </div>
  </div>

  <div class="field" id="lotField">
    <label data-i18n="lotSize">Lot Size</label>
    <input type="number" step="0.01" id="lot" value="0.01" dir="ltr">
  </div>
  <div class="field" id="riskField" style="display:none;">
    <label data-i18n="riskPerOrder">Risk % per order</label>
    <input type="number" step="0.1" id="risk" value="1" dir="ltr">
  </div>

  <div class="checkbox-row">
    <label><input type="checkbox" id="noSl" checked> <span data-i18n="noSl">No Stop Loss</span></label>
  </div>
  <div class="field" id="slField" style="display:none;">
    <label data-i18n="stopLoss">Stop Loss ($)</label>
    <input type="number" step="0.01" id="slamount" value="5" dir="ltr">
  </div>

  <div class="checkbox-row">
    <label><input type="checkbox" id="noTp" checked> <span data-i18n="noTp">No Take Profit</span></label>
  </div>
  <div class="field" id="tpField" style="display:none;">
    <label data-i18n="takeProfit">Take Profit ($)</label>
    <input type="number" step="0.01" id="tpamount" value="5" dir="ltr">
  </div>

  <div class="field">
    <label data-i18n="killSwitch">Kill Switch: opposite-side trigger count</label>
    <input type="number" step="1" id="killswitchcount" value="3" dir="ltr">
  </div>

  <button class="btn btn-green" id="btnPlace" data-i18n="placeOrders">Place Orders</button>

  <div class="trigger-section" id="triggerSection" style="display:none;">
    <div class="quick-title" data-i18n="armedTriggers">Armed Triggers</div>
    <div id="triggersList"></div>
  </div>

  <div id="marketOnlyActions">
    <button class="btn btn-red" id="btnCloseAll" data-i18n="closeAll">Close All Trades</button>

    <div class="quick-actions">
      <div class="quick-title" data-i18n="quickActions">Quick Actions</div>
      <div class="quick-row">
        <button class="btn-quick" id="btnCancelPending" data-i18n="cancelPending">Cancel Pending</button>
        <button class="btn-quick" id="btnRecenter" data-i18n="recenter">Re-center Grid</button>
      </div>
      <div class="quick-row" style="grid-template-columns:1fr 1fr 1fr;">
        <button class="btn-quick" id="btnSecureBE" data-i18n="breakeven">Breakeven</button>
        <button class="btn-quick" id="btnSecure10" data-i18n="lock10">Lock 10%</button>
        <button class="btn-quick" id="btnSecure30" data-i18n="lock30">Lock 30%</button>
      </div>
      <label data-i18n="customPercentLabel" style="margin-top:8px;">Custom % to lock</label>
      <div class="quick-row" style="grid-template-columns:1fr 1fr;">
        <input type="number" step="0.1" id="custompercent" value="15" dir="ltr" style="width:100%;">
        <button class="btn-quick" id="btnSecureCustom" data-i18n="secureCustom">Secure Custom %</button>
      </div>
    </div>
  </div>

  <div class="notice" id="notice"></div>
</div>

<script>
  var translations = {
    en: {
      header: "Order Configuration",
      instrument: "Instrument",
      gold: "Gold",
      custom: "Custom",
      customInstrumentLabel: "Custom Instrument (type to search)",
      noSuggestions: "No matches - check the spelling or try a shorter search.",
      orderType: "Order Type",
      marketOrders: "Market Orders",
      futureOrders: "Future Orders",
      futureRefPrice: "Future Reference Price",
      buyStops: "Buy Stops",
      sellStops: "Sell Stops",
      firstDistance: "First Order Distance ($)",
      spacing: "Order Spacing ($)",
      sizingMode: "Position Size Mode",
      fixedLot: "Fixed Lot",
      riskPct: "Risk %",
      lotSize: "Lot Size",
      riskPerOrder: "Risk % per order",
      noSl: "No Stop Loss",
      noTp: "No Take Profit",
      stopLoss: "Stop Loss ($)",
      takeProfit: "Take Profit ($)",
      killSwitch: "Kill Switch: opposite-side trigger count",
      placeOrders: "Place Orders",
      closeAll: "Close All Trades",
      quickActions: "Quick Actions",
      cancelPending: "Cancel Pending",
      recenter: "Re-center Grid",
      breakeven: "Breakeven",
      lock10: "Lock 10%",
      lock30: "Lock 30%",
      pendingNow: "Pending Now",
      cancelFuture: "Cancel Future",
      secureCustom: "Secure Custom %",
      customPercentLabel: "Custom % to lock",
      armedTriggers: "Armed Triggers",
      dropsTo: "Fires when price drops to",
      risesTo: "Fires when price rises to",
      updateBtn: "Update",
      cancelBtn: "Cancel",
      noTriggers: "No armed triggers for this instrument.",
      previewNotice: "Preview mode - open this from the bot to actually send commands.",
      confirmClose: "Cancel all pending orders and close all open positions for "
    },
    ar: {
      header: "إعدادات الأمر",
      instrument: "الأداة المالية",
      gold: "الذهب",
      custom: "مخصص",
      customInstrumentLabel: "أداة مخصصة (اكتب للبحث)",
      noSuggestions: "لا توجد نتائج مطابقة - تحقق من الإملاء أو جرّب بحثًا أقصر.",
      orderType: "نوع الأمر",
      marketOrders: "أوامر السوق",
      futureOrders: "أوامر مستقبلية",
      futureRefPrice: "السعر المرجعي المستقبلي",
      buyStops: "أوامر الشراء",
      sellStops: "أوامر البيع",
      firstDistance: "مسافة الأمر الأول ($)",
      spacing: "التباعد بين الأوامر ($)",
      sizingMode: "وضع حجم الصفقة",
      fixedLot: "حجم ثابت",
      riskPct: "نسبة المخاطرة %",
      lotSize: "حجم اللوت",
      riskPerOrder: "نسبة المخاطرة لكل أمر %",
      noSl: "بدون وقف خسارة",
      noTp: "بدون جني أرباح",
      stopLoss: "وقف الخسارة ($)",
      takeProfit: "جني الأرباح ($)",
      killSwitch: "مفتاح الإيقاف: عدد التفعيلات المعاكسة",
      placeOrders: "تنفيذ الأوامر",
      closeAll: "إغلاق جميع الصفقات",
      quickActions: "إجراءات سريعة",
      cancelPending: "إلغاء الأوامر المعلقة",
      recenter: "إعادة توسيط الشبكة",
      breakeven: "التعادل",
      lock10: "تثبيت 10%",
      lock30: "تثبيت 30%",
      pendingNow: "المعلق الآن",
      cancelFuture: "إلغاء الأمر المستقبلي",
      secureCustom: "تأمين نسبة مخصصة %",
      customPercentLabel: "نسبة مخصصة للتأمين %",
      armedTriggers: "الأوامر المستقبلية المفعّلة",
      dropsTo: "يُنفَّذ عندما ينخفض السعر إلى",
      risesTo: "يُنفَّذ عندما يرتفع السعر إلى",
      updateBtn: "تحديث",
      cancelBtn: "إلغاء",
      noTriggers: "لا توجد أوامر مستقبلية مفعّلة لهذه الأداة.",
      previewNotice: "وضع المعاينة - افتح هذه اللوحة من البوت لإرسال الأوامر فعليًا.",
      confirmClose: "إلغاء جميع الأوامر المعلقة وإغلاق جميع الصفقات المفتوحة لـ "
    }
  };

  var currentLang = 'en';
  try { currentLang = localStorage.getItem('goldTraderLang') || 'en'; } catch(e){}

  function applyLanguage(lang){
    currentLang = lang;
    try { localStorage.setItem('goldTraderLang', lang); } catch(e){}
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(translations[lang][key]) el.textContent = translations[lang][key];
    });
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langAr').classList.toggle('active', lang === 'ar');
    if(!tg) document.getElementById('notice').textContent = translations[lang].previewNotice;
  }
  document.getElementById('langEn').addEventListener('click', function(){ applyLanguage('en'); if(typeof renderTriggersList === 'function') renderTriggersList(); });
  document.getElementById('langAr').addEventListener('click', function(){ applyLanguage('ar'); if(typeof renderTriggersList === 'function') renderTriggersList(); });

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  applyLanguage(currentLang);

  // Prefill from the query string the bot builds (?symbol=...&buystops=...&etc)
  var params = new URLSearchParams(window.location.search);
  function setVal(id, key, fallback){
    var v = params.get(key);
    var el = document.getElementById(id);
    if(v !== null && v !== '') el.value = v;
    else if(fallback !== undefined) el.value = fallback;
  }
  setVal('futureprice','futureprice','0');
  setVal('buystops','buystops','5');
  setVal('sellstops','sellstops','5');
  setVal('firstdistance','firstdistance','5');
  setVal('spacing','spacing','2');
  setVal('lot','lot','0.01');
  setVal('risk','risk','1');
  setVal('slamount','slamount','5');
  setVal('tpamount','tpamount','5');
  setVal('killswitchcount','maxoppositefills','3');

  // Armed future triggers for this instrument, as sent by the bot: "id:price:dir,id:price:dir,..."
  var triggersParam = params.get('triggers') || '';
  var armedTriggers = triggersParam.split(',').filter(Boolean).map(function(t){
    var parts = t.split(':');
    return { id: parts[0], price: parts[1], dir: parts[2] };
  });

  function renderTriggersList(){
    var container = document.getElementById('triggersList');
    if(!container) return;
    container.innerHTML = '';
    if(armedTriggers.length === 0){
      var p = document.createElement('div');
      p.className = 'notice';
      p.style.textAlign = 'left';
      p.textContent = translations[currentLang].noTriggers;
      container.appendChild(p);
      return;
    }
    armedTriggers.forEach(function(trig){
      var row = document.createElement('div');
      row.className = 'trigger-row';
      var dirLabel = (trig.dir === 'drop') ? translations[currentLang].dropsTo : translations[currentLang].risesTo;
      var priceInputId = 'trigPrice_' + trig.id;
      row.innerHTML =
        '<label>#' + trig.id + ' - ' + dirLabel + '</label>' +
        '<div class="trigger-controls">' +
          '<input type="number" step="0.01" dir="ltr" id="' + priceInputId + '" value="' + trig.price + '">' +
          '<button type="button" class="btn-quick trig-update" data-id="' + trig.id + '">' + translations[currentLang].updateBtn + '</button>' +
          '<button type="button" class="btn-quick trig-cancel" data-id="' + trig.id + '" style="background:var(--red);color:#fff;">' + translations[currentLang].cancelBtn + '</button>' +
        '</div>';
      container.appendChild(row);
    });
    container.querySelectorAll('.trig-update').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.dataset.id;
        var priceInput = document.getElementById('trigPrice_' + id);
        sendAction({action:'updatetrigger', symbol: getSymbolValue(), triggerid: id, triggerprice: parseFloat(priceInput.value) || 0});
      });
    });
    container.querySelectorAll('.trig-cancel').forEach(function(btn){
      btn.addEventListener('click', function(){
        sendAction({action:'deletetrigger', symbol: getSymbolValue(), triggerid: btn.dataset.id});
      });
    });
  }
  renderTriggersList();

  // Instrument: Gold / US100 / Custom - whichever the bot last remembered gets pre-selected
  var incomingSymbol = params.get('symbol') || 'XAUUSD';
  var instrumentChoice = (incomingSymbol === 'XAUUSD' || incomingSymbol === 'US100') ? incomingSymbol : 'custom';
  if(instrumentChoice === 'custom') document.getElementById('customSymbol').value = incomingSymbol;

  function getSymbolValue(){
    return (groupValues.instrument === 'custom') ? str('customSymbol') : groupValues.instrument;
  }
  function updateSymbolTitle(){
    document.getElementById('symbolTitle').textContent = getSymbolValue().toUpperCase();
  }
  document.getElementById('customSymbol').addEventListener('input', updateSymbolTitle);

  // Live-filtered suggestions from the broker's full symbol list, sent by the bot when the panel opened
  var allSymbolsParam = params.get('allsymbols') || '';
  var allSymbols = allSymbolsParam.split(',').filter(Boolean);

  var suggestBox = document.getElementById('symbolSuggestions');
  var highlightedIndex = -1;

  function renderSuggestions(matches){
    suggestBox.innerHTML = '';
    highlightedIndex = -1;
    if(matches.length === 0){
      suggestBox.classList.remove('show');
      return;
    }
    matches.slice(0, 8).forEach(function(sym){
      var item = document.createElement('div');
      item.className = 'suggestion-item';
      item.textContent = sym;
      item.addEventListener('click', function(){
        document.getElementById('customSymbol').value = sym;
        updateSymbolTitle();
        suggestBox.classList.remove('show');
        suggestBox.innerHTML = '';
      });
      suggestBox.appendChild(item);
    });
    suggestBox.classList.add('show');
  }

  document.getElementById('customSymbol').addEventListener('input', function(){
    var query = this.value.trim().toUpperCase();
    if(query.length === 0){ suggestBox.classList.remove('show'); suggestBox.innerHTML = ''; return; }
    var matches = allSymbols.filter(function(sym){ return sym.toUpperCase().indexOf(query) >= 0; });
    renderSuggestions(matches);
  });
  document.addEventListener('click', function(e){
    if(e.target.id !== 'customSymbol' && !suggestBox.contains(e.target)){
      suggestBox.classList.remove('show');
    }
  });

  // Toggle button groups (Instrument / Order Type / Position Size Mode)
  var groupValues = { instrument: instrumentChoice, mode: params.get('mode') || 'market', sizing: params.get('sizing') || 'fixed' };
  document.querySelectorAll('.toggle-btn').forEach(function(btn){
    var group = btn.dataset.group, value = btn.dataset.value;
    if(groupValues[group] === value) btn.classList.add('active'); else btn.classList.remove('active');
    btn.addEventListener('click', function(){
      document.querySelectorAll('.toggle-btn[data-group="'+group+'"]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      groupValues[group] = value;
      applyVisibility();
    });
  });

  function applyVisibility(){
    document.getElementById('futurePriceField').style.display = (groupValues.mode === 'future') ? 'block' : 'none';
    document.getElementById('lotField').style.display = (groupValues.sizing === 'fixed') ? 'block' : 'none';
    document.getElementById('riskField').style.display = (groupValues.sizing === 'risk') ? 'block' : 'none';
    document.getElementById('slField').style.display = document.getElementById('noSl').checked ? 'none' : 'block';
    document.getElementById('tpField').style.display = document.getElementById('noTp').checked ? 'none' : 'block';
    document.getElementById('customSymbolField').style.display = (groupValues.instrument === 'custom') ? 'block' : 'none';
    document.getElementById('triggerSection').style.display = (groupValues.mode === 'future') ? 'block' : 'none';
    document.getElementById('marketOnlyActions').style.display = (groupValues.mode === 'market') ? 'block' : 'none';
    updateSymbolTitle();
  }
  // Pre-set checkboxes from query string (sl=true means stop loss IS enabled -> "No Stop Loss" unchecked)
  document.getElementById('noSl').checked = (params.get('sl') !== 'true');
  document.getElementById('noTp').checked = (params.get('tp') !== 'true');
  document.getElementById('noSl').addEventListener('change', applyVisibility);
  document.getElementById('noTp').addEventListener('change', applyVisibility);
  applyVisibility();

  function num(id){ return parseFloat(document.getElementById(id).value) || 0; }
  function str(id){ return document.getElementById(id).value.trim(); }

  var alreadySubmitting = false;
  function sendAction(payload){
    if(alreadySubmitting) return; // blocks a double-tap from sending the same action twice
    alreadySubmitting = true;
    if(!tg){ alert('Open this panel from the Telegram bot to send commands.'); alreadySubmitting = false; return; }
    tg.sendData(JSON.stringify(payload));
    tg.close();
  }

  document.getElementById('btnPlace').addEventListener('click', function(){
    sendAction({
      action: 'place',
      symbol: getSymbolValue(),
      mode: groupValues.mode,
      futureprice: num('futureprice'),
      buystops: num('buystops'),
      sellstops: num('sellstops'),
      firstdistance: num('firstdistance'),
      spacing: num('spacing'),
      sizing: groupValues.sizing,
      lot: num('lot'),
      risk: num('risk'),
      sl: !document.getElementById('noSl').checked,
      slamount: num('slamount'),
      tp: !document.getElementById('noTp').checked,
      tpamount: num('tpamount'),
      maxoppositefills: num('killswitchcount')
    });
  });

  document.getElementById('btnCloseAll').addEventListener('click', function(){
    if(confirm(translations[currentLang].confirmClose + getSymbolValue() + '?')) sendAction({action:'closeall', symbol: getSymbolValue(), maxoppositefills: num('killswitchcount')});
